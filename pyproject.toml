[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtir-reference"
version = "0.1.0"
description = "Independent reference implementation and state verification for DTI-R"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DTI-R contributors"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests"]
testpaths = ["tests"]
addopts = "-q"
